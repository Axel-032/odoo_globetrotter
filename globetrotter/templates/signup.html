</head>

    <div class="auth-page">
        <div class="sideimg"></div>

            <div class="brand">

  -->
                        
 
                        
                            <h2>Create your account ✨</h2>
                        <p id="dev">    
                            Start planning your next adventure today.
                        </p>
 
                    </div>
 
                    {% if messages %}
                        <ul class="form-errors">
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
 
                    <form method="post" action="{% url 'signup' %}">
 
                        {% csrf_token %}
 
                        <div id="Form">
 
                            <!-- Full Name -->
 
                            <div class="form-group">
 
                                <label for="signup-name">
                                    Full Name
                                </label>
 
                                <input
                                    type="text"
                                    id="signup-name"
                                    name="full_name"
                                    placeholder="Enter your full name"
                                    required
                                >
 
                            </div>
 
 
                            <!-- Email -->
 
                            <div class="form-group">
                                <div id="email">
                                    <label for="signup-email">
                                        Email Address
                                    </label>
 
                                    <input
                                        type="email"
                                        id="signup-email"
                                        name="email"
                                        placeholder="you@example.com"
                                        required
                                    >
                                </div>
                            </div>
 
 
                            <!-- Password -->
 
                            <div class="form-group">
 
                                <label for="signup-password">
                                    Password
                                </label>
 
                                <input
                                    type="password"
                                    id="signup-password"
                                    name="password"
                                    placeholder="Create a password"
                                    minlength="6"
                                    required
                                >
 
                            </div>
 
 
                            <!-- Confirm Password -->
 
                            <div class="form-group">
 
                                <label for="confirm-password">
                                    Confirm Password
                                </label>
 
                                <input
                                    type="password"
                                    id="confirm-password"
                                    name="confirm_password"
                                    placeholder="Confirm your password"
                                    minlength="6"
                                    required
                                >
 
                            </div>
 
 
                            <!-- Terms -->
 
                            <label class="terms-label">
 
                                <input
                                    type="checkbox"
                                    name="agreed_to_terms"
                                    required
                                >
 
                                <span>
                                    
                                    <a href="#">I agree to the Terms &amp; Conditions</a>
                                </span>
 
                            </label>
 
 
                            <!-- Signup button -->
 
                            <button
                                type="submit"
                                class="auth-btn"
                            >
                                Create Account
                            </button>
 
                        </div>
 
                    </form>
 
 
                    <!-- Divider -->
 
                    <div class="divider">
                        <span>OR</span>
                    </div>
 
 
                    <!-- Login -->
 
                    <p class="switch-text">
 
                        Already have an account?
 
                        <a href="{% url 'login' %}" class="switch-btn">
                            Login
                        </a>
 
                    </p>
 
                </div>
 
            </div>
 
        </div>
 
    </div>
 
</body>
